<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 | Portfolio</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body data-theme="default">
    <div class="page-shell page-shell-404">
      <main class="terminal-frame terminal-frame-404" aria-label="Portfolio 404 page">
        <header class="terminal-header">
          <div class="window-controls" aria-hidden="true">
            <span class="control red"></span>
            <span class="control yellow"></span>
            <span class="control green"></span>
          </div>
          <div class="window-title">404: page not found</div>
        </header>
        <section class="terminal-output">
          <div class="terminal-line">The requested page does not exist.</div>
          <div class="terminal-line">Redirecting to the portfolio home page...</div>
        </section>
      </main>
    </div>

    <script>
      window.addEventListener('load', () => {
        setTimeout(() => {
          window.location.href = './index.html';
        }, 1200);
      });
    </script>
  </body>
</html>
